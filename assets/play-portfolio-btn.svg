<svg xmlns="http://www.w3.org/2000/svg" width="430" height="68" viewBox="0 0 430 68" fill="none" role="img" aria-label="Jogar Portfólio 3D — VW Gol G5">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="430" y2="68" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0c111b" />
      <stop offset="55%" stop-color="#111827" />
      <stop offset="100%" stop-color="#161e2e" />
    </linearGradient>
    <linearGradient id="topSheen" x1="215" y1="0" x2="215" y2="34" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="topRim" x1="16" y1="1.5" x2="414" y2="1.5" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.04" />
      <stop offset="25%" stop-color="#ffffff" stop-opacity="0.22" />
      <stop offset="75%" stop-color="#ffffff" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.04" />
    </linearGradient>
    <linearGradient id="emeraldBar" x1="0" y1="1" x2="0" y2="67" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3cc385" />
      <stop offset="50%" stop-color="#2ea86f" />
      <stop offset="100%" stop-color="#218254" />
    </linearGradient>
    <linearGradient id="emblemFill" x1="32" y1="18" x2="32" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#35b97c" />
      <stop offset="100%" stop-color="#228658" />
    </linearGradient>
    <linearGradient id="pillFill" x1="348" y1="20" x2="348" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1d352e" />
      <stop offset="100%" stop-color="#142622" />
    </linearGradient>
    <clipPath id="cardClip">
      <rect x="1" y="1" width="428" height="66" rx="11" />
    </clipPath>
  </defs>

  <!-- Base metallic card -->
  <g clip-path="url(#cardClip)">
    <rect x="1" y="1" width="428" height="66" rx="11" fill="url(#bgGrad)" />
    <rect x="1" y="1" width="428" height="33" fill="url(#topSheen)" />

    <!-- Subtle technical grid accent on right edge -->
    <path d="M 332 1 L 332 67" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1" />

    <!-- Left emerald accent bar -->
    <rect x="1" y="1" width="4.5" height="66" fill="url(#emeraldBar)" />
  </g>

  <!-- Double outer border & top specular highlight -->
  <rect x="1" y="1" width="428" height="66" rx="11" stroke="#2c3a4f" stroke-width="1.2" />
  <rect x="2.5" y="2.5" width="425" height="63" rx="9.5" stroke="#ffffff" stroke-opacity="0.07" stroke-width="1" />
  <line x1="16" y1="1.6" x2="414" y2="1.6" stroke="url(#topRim)" stroke-width="1" stroke-linecap="round" />

  <!-- Circular Play emblem -->
  <circle cx="32" cy="34" r="19" fill="#2ea86f" fill-opacity="0.12" />
  <circle cx="32" cy="34" r="16" fill="url(#emblemFill)" stroke="#52d699" stroke-opacity="0.45" stroke-width="1" />
  <path d="M 28.5 27.2 L 39.2 34 L 28.5 40.8 Z" fill="#ffffff" />

  <!-- Primary and secondary typography -->
  <text x="59" y="30" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="0.4">JOGAR PORTFÓLIO 3D — VW GOL G5</text>
  <text x="59" y="47.5" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.8" font-weight="500" letter-spacing="0.15">Three.js · Blender 5.1 · 1ª &amp; 3ª Pessoa · Mundo 3D Ao Vivo</text>

  <!-- Right ABRIR pill with arrow -->
  <rect x="348" y="20" width="68" height="28" rx="14" fill="url(#pillFill)" stroke="#2ea86f" stroke-opacity="0.55" stroke-width="1" />
  <text x="360" y="37.5" fill="#d1fae5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.2" font-weight="700" letter-spacing="0.7">ABRIR</text>
  <path d="M 397.5 34 L 405.5 34 M 402.5 30.8 L 405.8 34 L 402.5 37.2" stroke="#5eead4" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
</svg>
